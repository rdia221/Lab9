<!doctype html>
<html>
  <head>
    <title>Latest News</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        color: #333;
      }

      h1 {
        background-color: #222;
        color: white;
        text-align: center;
        padding: 25px;
        margin: 0;
      }

      #news-container {
        width: 75%;
        margin: 30px auto;
      }

      #news-container div {
        background-color: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px #ccc;
      }

      h2 {
        color: #222;
      }

      a {
        color: #0077cc;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <h1>Latest News</h1>

    <div id="news-container"></div>

    <script src="script.js"></script>
  </body>
</html>
